[project]
name = "ai-evaluation-platform"
version = "0.1.0"
description = "Production-Grade LLM Evaluation & RAG Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "google-genai>=1.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "tenacity>=8.4.1",
    "PyPDF2>=3.0.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
